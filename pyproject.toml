[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "plagiarism-checker-plus"
version = "1.0.0"
description = "Official Python client for the Plagiarism Checker Plus API: plagiarism checker API with linked sources and AI detector API with a per-sentence AI likelihood."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Plagiarism Checker Plus", email = "contact@plagiarismcheckerplus.com" }]
maintainers = [{ name = "Plagiarism Checker Plus", email = "contact@plagiarismcheckerplus.com" }]
keywords = [
  "plagiarism checker api",
  "ai detector api",
  "ai detection",
  "plagiarism checker",
  "plagiarism detection",
  "ai content detector",
  "ai writing detection",
  "plagiarism",
  "sdk",
  "api client",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://plagiarismcheckerplus.com/integrations/api"
Documentation = "https://app.plagiarismcheckerplus.com/api-docs"
"AI Detector API" = "https://plagiarismcheckerplus.com/ai-detector-api"
Repository = "https://github.com/pcp-tech/plagiarism-checker-plus-python"
Issues = "https://github.com/pcp-tech/plagiarism-checker-plus-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/plagiarism_checker_plus"]

[tool.hatch.build.targets.sdist]
include = ["src/plagiarism_checker_plus", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
